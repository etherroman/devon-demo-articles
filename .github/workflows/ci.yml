name: Articles CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GIN_MODE: test
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
          cache: true
      - run: go mod download
      - run: go mod verify
      - run: go test -count=1 ./...
      - run: go vet ./...
      - run: go build ./...
